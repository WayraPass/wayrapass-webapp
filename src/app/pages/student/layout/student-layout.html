<div class="student-shell">
  <header class="mobile-header">
    <a class="brand" routerLink="/student/dashboard" aria-label="WayraPass, inicio del estudiante">
      <img class="brand-logo" src="/assets/branding/logo.png" alt="WayraPass" />
    </a>
    <button type="button" class="menu-button" (click)="menuOpen.set(!menuOpen())" [attr.aria-expanded]="menuOpen()" aria-controls="student-navigation" aria-label="Abrir menú de navegación">
      <mat-icon>{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
    </button>
  </header>

  <aside class="student-sidebar" [class.open]="menuOpen()">
    <a class="brand sidebar-brand" routerLink="/student/dashboard" (click)="closeMenu()" aria-label="WayraPass, inicio del estudiante">
      <img class="brand-logo" src="/assets/branding/logo.png" alt="WayraPass" />
    </a>

    <nav id="student-navigation" class="student-nav" aria-label="Menú del estudiante">
      <span class="nav-title">Mi espacio</span>
      <a routerLink="/student/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()"><mat-icon>home</mat-icon>Inicio</a>
      <a routerLink="/student/routes" routerLinkActive="active" (click)="closeMenu()"><mat-icon>route</mat-icon>Buscar rutas</a>
      <a routerLink="/student/current-trip" routerLinkActive="active" (click)="closeMenu()"><mat-icon>directions_bus</mat-icon>Mi viaje actual</a>
      <a routerLink="/student/history" routerLinkActive="active" (click)="closeMenu()"><mat-icon>history</mat-icon>Historial</a>
    </nav>

    <div class="student-user">
      <span class="avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="identity"><strong>{{ user()?.fullName }}</strong><small>Estudiante</small></span>
      <button type="button" (click)="logout()" aria-label="Cerrar sesión" title="Cerrar sesión"><mat-icon>logout</mat-icon></button>
    </div>
  </aside>

  @if (menuOpen()) { <button type="button" class="menu-backdrop" (click)="closeMenu()" aria-label="Cerrar menú"></button> }

  <main class="student-content">
    <router-outlet />
  </main>
</div>
