<div class="dashboard-content">
  <section class="welcome-card">
    <div class="role-icon"><mat-icon>school</mat-icon></div>
    <p class="eyebrow">Acceso de estudiante</p>
    <h1>Hola, {{ user()?.fullName }}</h1>
    <p>Busca rutas para tu institución, revisa tus favoritos y sigue tu viaje activo desde un solo lugar.</p>
    <div class="dashboard-actions">
      <a routerLink="/student/routes"><mat-icon>route</mat-icon>Buscar rutas</a>
      <a routerLink="/student/enrollment" class="secondary"><mat-icon>assignment</mat-icon>Mi inscripción</a>
      <a routerLink="/student/current-trip" class="secondary"><mat-icon>directions_bus</mat-icon>Mi viaje actual</a>
    </div>
  </section>
  <section class="scope-card"><mat-icon>verified_user</mat-icon><div><h2>Sesión verificada</h2></div></section>
</div>
