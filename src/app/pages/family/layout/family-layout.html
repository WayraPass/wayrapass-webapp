<div class="student-shell">
  <header class="mobile-header"><a class="brand" routerLink="/family/dashboard" aria-label="WayraPass, inicio familiar"><img class="brand-logo" src="/assets/branding/logo.png" alt="WayraPass" /></a><button type="button" class="menu-button" (click)="menuOpen.set(!menuOpen())" [attr.aria-expanded]="menuOpen()" aria-controls="family-navigation" aria-label="Abrir menú de navegación"><mat-icon>{{ menuOpen() ? 'close' : 'menu' }}</mat-icon></button></header>
  <aside class="student-sidebar" [class.open]="menuOpen()">
    <a class="brand sidebar-brand" routerLink="/family/dashboard" (click)="closeMenu()" aria-label="WayraPass, inicio familiar"><img class="brand-logo" src="/assets/branding/logo.png" alt="WayraPass" /></a>
    <nav id="family-navigation" class="student-nav" aria-label="Menú familiar"><span class="nav-title">Mi espacio</span><a routerLink="/family/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()"><mat-icon>home</mat-icon>Inicio</a><a routerLink="/family/tracking" routerLinkActive="active" (click)="closeMenu()"><mat-icon>location_searching</mat-icon>Seguimiento</a><a routerLink="/family/history" routerLinkActive="active" (click)="closeMenu()"><mat-icon>history</mat-icon>Historial</a></nav>
    <div class="student-user"><span class="avatar" aria-hidden="true">{{ initials() }}</span><span class="identity"><strong>{{ user()?.fullName }}</strong><small>Familiar autorizado</small></span><button type="button" (click)="logout()" aria-label="Cerrar sesión" title="Cerrar sesión"><mat-icon>logout</mat-icon></button></div>
  </aside>
  @if (menuOpen()) { <button type="button" class="menu-backdrop" (click)="closeMenu()" aria-label="Cerrar menú"></button> }
  <main class="student-content"><router-outlet /></main>
</div>
